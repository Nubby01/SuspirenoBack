{% extends "panel/base.html" %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" enctype="multipart/form-data" class="formulario tarjeta">
  {% csrf_token %}
  {{ form.as_p }}
  <div class="acciones">
    <button class="boton" type="submit">Guardar</button>
    <a class="boton secundario" href="{{ volver }}">Volver</a>
  </div>
</form>
{% endblock %}
